services:
  - type: web
    name: marketing-hub
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: AUTH_REQUIRED
        value: 1
      - key: DATABASE_URL
        fromDatabase:
          name: marketing-hub-db
          property: connectionString
      - key: DATABASE_SSL
        value: 1
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_EMAIL_DOMAINS
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_SCOPES
        value: pages_show_list,pages_read_engagement,pages_manage_posts,instagram_basic,instagram_content_publish

databases:
  - name: marketing-hub-db
    region: singapore
    plan: basic-256mb
    databaseName: marketing_hub
    user: marketing_hub
    ipAllowList: []
